[project]
name = "categorization"
version = "1.0.0"
description = "Generic categorization pipeline for batch LLM classification tasks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0.0",
    "click>=8.0.0",
    "google-cloud-bigquery>=3.25.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
    "openai>=1.3.0",
    "python-json-logger>=2.0.7",
    "db-dtypes>=1.5.0",
]

[project.scripts]
categorization = "categorization.management.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.8.0",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
minversion = "6.0"
addopts = "-ra -q --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
